<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UDrive — Cars are managed in the app</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="brand_assets/udrive-icon.png" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#07070f;color:#eeeef5;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
    main{max-width:440px;text-align:center}
    h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.75rem}
    p{color:#a0a0c0;line-height:1.6;margin-bottom:1.5rem}
    a.btn{display:inline-block;padding:.8rem 1.4rem;border-radius:10px;background:#F97316;color:#fff;font-weight:600;text-decoration:none;
      transition:transform .15s ease,opacity .15s ease}
    a.btn:hover{opacity:.92;transform:translateY(-1px)}
    a.btn:active{transform:translateY(0)}
    a.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <h1>Cars are now managed in the app</h1>
    <p>This page is retired. To add a car, change photos, a price or a description, or to take a car off the website, open the car in the fleet app and use “Website &amp; photos”.</p>
    <a class="btn" href="https://fleet-manager2-0.vercel.app/#vehicles">Open the fleet app</a>
  </main>
</body>
</html>
